<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Rama Cabs - Tirupati</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f8f8f8;
}

.topbar{
background:#a64612;
padding:12px;
text-align:center;
position:sticky;
top:0;
z-index:999;
}

.topbar a{
color:#fff;
font-size:28px;
font-weight:bold;
text-decoration:none;
}

.full-banner{
width:100%;
display:block;
}

.section{
padding:20px;
max-width:1400px;
margin:auto;
}

.section h2{
text-align:center;
margin:20px 0;
color:#5b2a0a;
font-size:36px;
}

.grid5{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:10px;
overflow:hidden;
text-align:center;
}

.card img{
width:100%;
display:block;
}

.card h3{
padding:10px;
font-size:20px;
}

.map iframe{
width:100%;
height:400px;
border:none;
border-radius:10px;
}

.contact{
background:white;
padding:40px 20px;
text-align:center;
}

.contact h2{
font-size:40px;
margin-bottom:20px;
}

.contact p{
font-size:20px;
line-height:1.8;
}

.whatsapp{
display:inline-block;
background:#25D366;
color:white;
padding:15px 30px;
border-radius:8px;
text-decoration:none;
font-size:22px;
margin-top:15px;
}

.terms{
background:#fff;
padding:30px;
margin-top:20px;
border-radius:10px;
}

.terms h2{
margin-bottom:20px;
}

.terms ol{
line-height:2;
font-size:18px;
}

footer{
background:#a64612;
color:#fff;
text-align:center;
padding:15px;
font-size:18px;
margin-top:20px;
}

.floating{
position:fixed;
right:20px;
bottom:20px;
background:#25D366;
color:white;
width:65px;
height:65px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
text-decoration:none;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

</style>
</head>
